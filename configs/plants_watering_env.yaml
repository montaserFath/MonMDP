defaults:
  - agent: q_learning
  - monitor: binary
  - _self_

environment:
#  id: gym_monitor/TreasureHunt-Penalty-v1
  grid_size: [6, 6]
  n_plants: 3
  plants_dryness_prob: 0.1
  dry_difference: 0.5
  agent_start_pos: [0, 0]
  max_episode_steps: 100
  n_walls: 3

wandb:
  mode: offline
  entity: ualberta-bowling
  project: MonMDP

experiment:
  training_timesteps: 5e5
  testing_episodes: 10
  testing_frequency: 1e5
  rng_seed: 1
  start_train_timestep: 1e4
  replay_buffer_size: 1e6
  batch_size: 128
  n_itr_episode: 100
  update_target_freq: 25
  save_log: True