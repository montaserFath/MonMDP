defaults:
  - agent: q_learning
  - monitor: binary
  - _self_

environment:
  id: gym_monitor/TreasureHunt-Penalty-v1
  random_action_prob: 0.0

wandb:
  mode: offline
  entity: ualberta-bowling
  project: MonMDP

experiment:
  training_timesteps: 5e5
  testing_episodes: 5
  testing_frequency: 1e4
  rng_seed: 1
  start_train_timestep: 1e4
  replay_buffer_size: 1e6
  batch_size: 128
  n_itr_episode: 100
  update_target_freq: 25
  save_log: True
